spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:cinema_db}
    hikari:
      maximum-pool-size: 10

booking:
  expiration-minutes: 20

scheduler:
  birthday-bonus:
    cron: "0 0 9 * * *"
  email-token:
    cleanup-expired-cron: "0 */30 * * * *"
    cleanup-confirmed-cron: "0 0 3 * * *"
  movie-status:
    cron: "0 0 2 * * *"
  session-status:
    cron: "0 */5 * * * *"
  booking:
    expiration-interval: 60000
    cleanup-cron: "0 0 4 * * *"
  payment:
    expiration-interval: 300000
    cleanup-cron: "0 0 5 * * *"
  ticket:
    mark-as-used: 300000
    cleanup-cron: "0 0 3 * * *"
  seat-reservation:
    expiration-interval: 60000
    cleanup-expired-interval: 300000
  refund:
    reconciliation-interval: 300000

logging:
  level:
    root: WARN