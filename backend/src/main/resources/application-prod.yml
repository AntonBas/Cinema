spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require&prepareThreshold=0
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 0
      idle-timeout: 60000
      keepalive-time: 0

  data:
    redis:
      url: ${REDIS_URL}

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

management:
  server:
    port: ${PORT:8080}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  rate-limit:
    client-ip-header: ${RATE_LIMIT_CLIENT_IP_HEADER:True-Client-IP}
  jwt:
    cookie-secure: true
    cookie-same-site: ${JWT_COOKIE_SAME_SITE:None}
  upload:
    cloudinary:
      cloud-name: ${CLOUDINARY_CLOUD_NAME}
      api-key: ${CLOUDINARY_API_KEY}
      api-secret: ${CLOUDINARY_API_SECRET}

scheduler:
  frequent-interval: ${SCHEDULER_FREQUENT_INTERVAL_MS:900000}
  hourly-cron: "0 0 * * * *"
  booking:
    expiration-interval: ${scheduler.frequent-interval}
    cancelled-session-interval: ${scheduler.frequent-interval}
  seat-reservation:
    expiration-interval: ${scheduler.frequent-interval}
    cleanup-expired-interval: ${scheduler.frequent-interval}
  payment:
    expiration-interval: ${scheduler.frequent-interval}
    processing-reconciliation-interval: ${scheduler.frequent-interval}
    orchestration-reconciliation-interval: ${scheduler.frequent-interval}
    refund-retry-interval: ${scheduler.frequent-interval}
  refund:
    reconciliation-interval: ${scheduler.frequent-interval}
    cancelled-session-interval: ${scheduler.frequent-interval}
  ticket:
    mark-as-used: ${scheduler.frequent-interval}
  session-status:
    cron: ${scheduler.hourly-cron}
  movie-status:
    cron: ${scheduler.hourly-cron}
  email-token:
    cleanup-expired-cron: ${scheduler.hourly-cron}

logging:
  level:
    root: WARN
    ua.lviv.bas.cinema: INFO
    org.springframework.cache: WARN
    org.springframework.data.redis: WARN
