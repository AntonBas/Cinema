spring:
  config:
    activate:
      on-profile: ci
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cinema_test}
    username: ${DB_USER:cinema}
    password: ${DB_PASSWORD:test}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
  cache:
    type: none
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test
            client-secret: test

app:
  jwt:
    secret: test_secret_key_for_ci
  email:
    from: test@test.com
  upload:
    dir: /tmp

payment:
  liqpay:
    public_key: test_public_key
    private_key: test_private_key
    sandbox_mode: true
    callback_url: http://localhost:8080/api/payment/callback
    result_url: http://localhost:5173
    api_url: https://www.liqpay.ua/api/

logging:
  level:
    root: WARN
    ua.lviv.bas.cinema: INFO